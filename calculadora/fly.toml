# Configuração do Fly.io para a calculadora oficial (T05).
# Deploy (de dentro da pasta calculadora/):   fly deploy
# Antes, uma vez:  fly apps create <nome>   e   fly secrets set MOTOR_CHAVE=<chave longa>
# Passo a passo completo: docs/deploy.md
app = "calculadora-reforma-motor"   # troque pelo nome que você criar
primary_region = "gru"              # São Paulo

[build]
  dockerfile = "Dockerfile"
  build-target = "producao"

[env]
  JAVA_OPTS = "-XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # sempre ligado: o Java demora ~10 s para acordar
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/saude"
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
