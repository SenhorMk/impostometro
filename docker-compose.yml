# Sobe a calculadora oficial da Receita na sua máquina.
#   docker compose up -d --build      (primeira vez demora ~5 min: baixa e compila)
#   ./scripts/validar-calculadora.sh  (confere o exemplo oficial)
#   docker compose down               (desliga)
services:
  calculadora:
    build:
      context: ./calculadora
      target: runtime
      args:
        CALC_VERSION: "1.7.2"
        CALC_COMMIT: "39363aa84103c6d58f7e8e76acb2f592691ec382"
    image: impostometro/calculadora:1.7.2
    container_name: impostometro-calculadora
    ports:
      - "8080:8080"   # API:   http://localhost:8080/api/swagger-ui.html
      - "9101:9101"   # saúde: http://localhost:9101/health
    restart: unless-stopped
