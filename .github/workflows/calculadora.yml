# Toda vez que algo da calculadora mudar, o GitHub compila a imagem,
# sobe o container e confere o exemplo oficial da Receita.
name: Calculadora oficial

on:
  push:
    branches: [main]
    paths: ["calculadora/**", "testes-dourados/**", "site/src/dados/**", "scripts/validar-calculadora.sh", "docker-compose.yml", ".github/workflows/calculadora.yml"]
  pull_request:
    paths: ["calculadora/**", "testes-dourados/**", "site/src/dados/**", "scripts/validar-calculadora.sh", "docker-compose.yml", ".github/workflows/calculadora.yml"]
  workflow_dispatch:

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Cache das camadas do Docker no GitHub: o Maven só baixa as dependências
      # quando a versão da calculadora muda (evita o limite de downloads do Maven Central).
      - uses: docker/setup-buildx-action@v3
      - name: Compilar a imagem da calculadora (com cache)
        uses: docker/build-push-action@v6
        with:
          context: ./calculadora
          load: true
          tags: impostometro/calculadora:1.7.2
          cache-from: type=gha,scope=calculadora
          cache-to: type=gha,mode=max,scope=calculadora
      - name: Subir a calculadora
        run: docker compose up -d --no-build
      - name: Conferir o exemplo oficial (CBS de R$ 42,24)
        run: ./scripts/validar-calculadora.sh
      - name: Conferir as 30 operações de referência (testes dourados)
        run: python3 testes-dourados/dourados.py
      - name: Conferir o dicionário de atividades do site
        run: python3 testes-dourados/atividades.py
      - name: Logs do container (se falhar)
        if: failure()
        run: docker compose logs calculadora
